services:
  - type: web
    name: jlpt-practice-langchain
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      # Call Ollama Cloud directly; no local Ollama daemon is needed.
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gpt-oss:120b
      # Set an Ollama Cloud API key in the Render dashboard (backend only).
      - key: OLLAMA_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGCHAIN_TRACING
        value: "false"
      - key: LANGSMITH_TRACING
        value: "false"
